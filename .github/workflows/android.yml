name: Приложение «Пульт TVHub» для Android

# Собирает TVHub-Remote.apk, когда меняется папка android/, и выкладывает его
# в выпуск «remote-app» (предварительный, чтобы не мешать обновлениям TVHub).
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Ключ подписи должен быть одним и тем же, иначе Android не ставит новую версию поверх старой.
      # Ключ создаётся при первой сборке и хранится в кэше GitHub Actions этого репозитория
      # (в сам репозиторий он не попадает). Кэш не забывается, пока им пользуются хотя бы раз
      # в неделю, — за этим следит keep-apk-key.yml.
      - name: Ключ подписи
        id: key
        uses: actions/cache/restore@v4
        with:
          path: ~/.tvhub-apk-key
          key: tvhub-apk-signing-v1

      - name: Новый ключ подписи (только в первый раз)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.tvhub-apk-key
          openssl rand -hex 16 > ~/.tvhub-apk-key/pass
          keytool -genkeypair -keystore ~/.tvhub-apk-key/apk.jks -storepass "$(cat ~/.tvhub-apk-key/pass)" -keypass "$(cat ~/.tvhub-apk-key/pass)" \
            -alias tvhub -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TVHub Remote, O=TVHub, C=RU"

      - name: Сохранить ключ подписи
        if: steps.key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.tvhub-apk-key
          key: tvhub-apk-signing-v1

      - name: Сборка APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          export APK_KEY_PASS="$(cat ~/.tvhub-apk-key/pass)"
          export APK_KEYSTORE="$HOME/.tvhub-apk-key/apk.jks"
          gradle -p android assembleRelease --no-daemon

      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TVHub-Remote.apk
          # По этому файлу приложение узнаёт, что вышла новая версия
          echo "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"1.0.${{ github.run_number }}\"}" > version.json
          if ! gh release view remote-app --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create remote-app --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Пульт TVHub для Android" \
              --notes "Приложение-пульт для телефона на Android. Установите TVHub-Remote.apk и отсканируйте QR-код в TVHub («Система» → «Пульт на телефоне»)."
          fi
          gh release upload remote-app TVHub-Remote.apk version.json --clobber --repo "$GITHUB_REPOSITORY"
