name: Ключ подписи приложения

# Раз в неделю обращается к кэшу с ключом подписи «Пульта TVHub», чтобы GitHub его не удалил
# (неиспользуемый 7 дней кэш удаляется). Без этого ключ поменялся бы, и приложение пришлось бы переустанавливать.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.tvhub-apk-key
          key: tvhub-apk-signing-v1
